[package]
name = "gba_rt"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["staticlib"]

[dependencies]
# vendor/: gba-recomp de4edf59 (MIT OR Apache-2.0), patched to no_std (see vendor/README.md)
gba-core = { path = "vendor/gba-core" }
# save states: gba-core's machine as compact bytes (no_std)
postcard = { version = "1", default-features = false, features = ["alloc"] }

[profile.release]
panic = "abort"
lto = true
opt-level = 3

[profile.dev]
panic = "abort"
